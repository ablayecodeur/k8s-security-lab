# Correction de la FAILLE 3. Le mot de passe quitte le manifest : le
# Deployment ne contient plus qu'une RÉFÉRENCE vers un Secret Kubernetes.
# Le Secret lui-même n'est dans aucun fichier : il est créé par
# scripts/05-corriger-secret.sh, avec un nouveau mot de passe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      serviceAccountName: web
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: boutique-db
                  key: mot-de-passe
